name: Copy Vota's master ledger
on:
  schedule:
    - cron: "30 4 * * *"   # Vota adds its daily entry at 03:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check and append
        run: python3 fetch.py
      - name: Install the OpenTimestamps client
        run: pip install opentimestamps-client
      - name: Weekly timestamp (Sundays) and finish waiting proofs
        run: python3 stamp.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Save
        run: |
          if [ -n "$(git status --porcelain ledger.jsonl checkpoints timestamps.json)" ]; then
            git config user.name "vota-ledger"
            git config user.email "vota-ledger@users.noreply.github.com"
            git add ledger.jsonl checkpoints timestamps.json
            if [ -n "$(git status --porcelain ledger.jsonl)" ]; then
              git commit -m "Ledger: $(tail -n 1 ledger.jsonl | python3 -c 'import sys,json; r=json.loads(sys.stdin.read()); print(r["day"], r["entry_hash"][:16])')"
            else
              git commit -m "Timestamps updated"
            fi
            git push
          fi
